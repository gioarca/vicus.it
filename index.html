    <!-- Iubenda: configurazione (deve stare prima di tutto) -->
    <script>
      var _iub = _iub || [];
      _iub.csConfiguration = {
        siteId: 4045593,
        cookiePolicyId: 19298973,
        lang: "it",
        storage: { useSiteId: true },

    <script src="//cdn.iubenda.com/cs/tcf/safe-tcf-v2.js"></script>
    <script src="//cdn.iubenda.com/cs/gpp/stub.js"></script>

    <!-- Iubenda: Cookie Solution (async, non blocca il render) -->
    <script
      src="//cdn.iubenda.com/cs/iubenda_cs.js"
      charset="UTF-8"
      async
    ></script>

    <!-- Meta Pixel: solo definizione della funzione fbq, NESSUN init/track -->
    <!-- L'init e il PageView avvengono nel callback onConsentGiven di iubenda -->

      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;

          n.callMethod

        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = "2.0";
        n.queue = [];
        t = b.createElement(e);
        t.async = !0;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      })(
        window,
        document,
        "script",
        "https://connect.facebook.net/en_US/fbevents.js",
      );

      // Solo revoca di default, prima del consenso
      fbq("consent", "revoke");
    </script>
